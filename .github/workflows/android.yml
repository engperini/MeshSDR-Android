name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set monotonically increasing APK version
        shell: bash
        run: echo "MESHSDR_VERSION_CODE=$((1000 + $(git rev-list --count HEAD)))" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub-hosted Ubuntu runners include an Android SDK. Avoid setup-android
      # (the failing action in run #8); install missing packages directly.
      - name: Check Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          test -d "${ANDROID_HOME:?Android SDK not available on runner}"
          ls -la "$ANDROID_HOME/cmdline-tools" || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - name: Install required SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: meshsdr-debug-signing-v1
      - name: Build native LoRa decoder and Android APK
        shell: bash
        run: |
          set +e
          gradle :app:assembleDebug --stacktrace --console=plain > build.log 2>&1
          code=$?
          echo "=== Build errors and context ==="
          grep -n -E '(^.*(error:|FAILED|FAILURE:|What went wrong|CMake Error|ninja: error|e: file|Unresolved reference).*$)' build.log | tail -100 || true
          tail -100 build.log
          exit "$code"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MeshSDR-build-log
          path: build.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MeshSDR-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
