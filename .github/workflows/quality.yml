name: Quality gates
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so rev-list --count increases per commit
      - name: Set monotonically increasing APK version
        shell: bash
        run: echo "MESHSDR_VERSION_CODE=$((1000 + $(git rev-list --count HEAD)))" >> "$GITHUB_ENV"
      - name: LoRa PHY tests (host, modulator -> rtl_tcp u8 -> decoder)
        shell: bash
        run: |
          cmake -S app/src/test/cpp -B build-host -DCMAKE_BUILD_TYPE=Release
          cmake --build build-host -j
          ctest --test-dir build-host --output-on-failure
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub-hosted Ubuntu runners include an Android SDK. Avoid setup-android
      # (the failing action in run #8); install missing packages directly.
      - name: Check Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          test -d "${ANDROID_HOME:?Android SDK not available on runner}"
          ls -la "$ANDROID_HOME/cmdline-tools" || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - name: Install required SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Android Lint
        shell: bash
        run: |
          set -o pipefail
          set +e
          gradle :app:lintDebug --console=plain > lint-console.log 2>&1
          result=$?
          set -e
          echo "=== Lint diagnostics ==="
          grep -nE '(^.*(Error:|Warning:|error:|warning:|Lint found|FAILURE:|What went wrong:|> Task :app:lint|\.kt:[0-9]+|\.xml:[0-9]+).*$)' lint-console.log | tail -100 || true
          if [ "$result" -ne 0 ]; then
            echo "=== Full final output ==="
            tail -90 lint-console.log
          fi
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MeshSDR-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/test-results/
            lint-console.log
            app/build/reports/lint-results-debug.txt
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
